name: CI

on:
  pull_request:
    branches: [main]
  # main에 직접 커밋하는 경우가 많아 pull_request만으로는 CI가 아예 돌지 않았다
  push:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn

      - run: yarn install --frozen-lockfile

      - run: yarn lint

      - run: yarn tsc --noEmit -p tsconfig.json

      # yarn test(Vitest Browser Mode)도 Playwright Chromium으로 돌기 때문에 유닛 테스트보다
      # 먼저 설치해야 한다 — 뒤에 두면 "Executable doesn't exist"로 유닛 테스트가 깨진다
      - run: npx playwright install --with-deps chromium

      - run: yarn test

      - run: yarn test:e2e

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
